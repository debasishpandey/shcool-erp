spring.application.name=SCHOOL-ERP

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/school_erp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:pandey}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# Default secret is a 256-bit base64 encoded string for development. MUST be overridden in production.
jwt.secret=${JWT_SECRET:413F4428472B4B6250655368566D5970337336763979244226452948404D6351}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Seed Super Admin
app.seed.super-admin=${SEED_SUPER_ADMIN:true}
